<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACRONYM (Acronyms Creating Recursion Of Narratives Yielding Meaning)</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #fff;
    color: #000;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
    overflow: hidden;
  }

  /* Fixed, non-scrolling viewport; the poem drifts inside it. */
  .stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
  }

  /* Full-width responsive poem column. */
  .flow {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    box-sizing: border-box;
    padding: 0 4vw;
    will-change: transform;
  }

  .verse {
    white-space: pre-wrap;
    text-align: left;
    font-size: clamp(26px, 4.5vw, 46px);
    line-height: 1.26;
    margin: 0 0 1em;
  }

  /* Instant hover tooltip showing the acronym's full CORDIS project title. */
  span[data-title] {
    position: relative;
    cursor: default;
  }

  span[data-title]:hover::after {
    content: attr(data-title);
    position: absolute;
    bottom: 1.2em;
    left: 0;
    max-width: min(30em, 92vw);
    white-space: normal;
    font-size: 14px;
    font-weight: 400;
    line-height: 1.3;
    background: #000;
    color: #fff;
    padding: 2px 8px;
    z-index: 5;
    pointer-events: none;
  }

  /* Circled-i info button, fixed in the bottom-right corner of the page. */
  .info {
    position: fixed;
    right: 12px;
    bottom: 10px;
    z-index: 10;
    font-size: 20px;
    line-height: 1;
    font-weight: 700;
    cursor: default;
    background: #fff;
    padding: 2px;
    user-select: none;
  }

  /* About popup: same style as the acronym title tooltips. Its width is set
     by the (nowrap) title alone; the body text wraps within that width. */
  .info-popup {
    display: none;
    position: absolute;
    right: 0;
    bottom: calc(100% + 8px);
    width: max-content;
    max-width: 92vw;
    white-space: normal;
    font-size: 14px;
    font-weight: 400;
    line-height: 1.3;
    text-align: left;
    background: #000;
    color: #fff;
    padding: 2px 8px;
    pointer-events: none;
  }

  .info:hover .info-popup { display: block; }
  .info-popup .t { font-weight: 700; white-space: nowrap; }
  /* Contributes 0 to the popup's intrinsic width, then fills it exactly,
     so author/description wrap at the title's width. */
  .info-popup .rest { width: 0; min-width: 100%; }
  .info-popup .a { font-style: italic; }
  .info-popup div { margin: 0 0 0.5em; }
  .info-popup div:last-child { margin-bottom: 0; }
  @media (max-width: 600px) {
    .info-popup { width: 92vw; }
    .info-popup .t { white-space: normal; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="flow" id="flow"></div>
</div>

<div class="info">&#9432;<div class="info-popup"><div class="t">ACRONYM (Acronyms Creating Recursion Of Narratives Yielding Meaning)</div><div class="rest"><div class="a">Gabriele de Seta, 2026</div><div>An endless generative poem composed by randomized acronyms of EU-funded research projects across framework programmes (FP1 1984 to Horizon Europe).</div></div></div></div>

<script>
'use strict';

/* ---------- helpers ---------- */

const pick = (r, a) => a[Math.floor(r() * a.length)];

const escAttr = s =>
  s.replace(/&/g, "&amp;")
   .replace(/"/g, "&quot;")
   .replace(/</g, "&lt;")
   .replace(/>/g, "&gt;");

/* ---------- verse engine ---------- */

function makeVerseEngine(A) {
  // Rhyme support: acronyms bucketed by trailing 1, 2 and 3 letters.
  const BY_SUF = { 1: {}, 2: {}, 3: {} };
  const SUFS = { 1: [], 2: [], 3: [] };
  for (const a of A) {
    for (let n = 1; n <= 3; n++) {
      const s = a.slice(-n);
      if (!BY_SUF[n][s]) { BY_SUF[n][s] = []; SUFS[n].push(s); }
      BY_SUF[n][s].push(a);
    }
  }
  // Pick a random element of pool that is not in `used`; null if pool exhausted.
  function pickUnused(r, pool, used) {
    if (!pool || !pool.length) return null;
    for (let t = 0; t < 10; t++) {
      const c = pool[(r() * pool.length) | 0];
      if (!used.has(c)) return c;
    }
    for (const c of pool) if (!used.has(c)) return c;
    return null;
  }

  // Rhyme-forced ending: share the last n letters of the class suffix, but if
  // every candidate is already used this generation, relax the constraint
  // (3 -> 2 -> 1 shared letters), finally falling back to any unused acronym.
  function acrEnding(r, rhyme, used) {
    for (let n = rhyme.n; n >= 1; n--) {
      const c = pickUnused(r, BY_SUF[n][rhyme.suffix.slice(-n)], used);
      if (c) return c;
    }
    return pickUnused(r, A, used);
  }

  // One line of 1..6 acronyms, optionally forced to end on a shared n-letter
  // suffix. Every acronym is recorded in `used` so it never repeats within one
  // generation (one stanza() call).
  function lineOfLen(r, n, rhyme, used) {
    const parts = [];
    const count = Math.max(1, n);
    for (let i = 0; i < count; i++) {
      const c = pickUnused(r, A, used) || pick(r, A);
      parts.push(c);
      used.add(c);
    }
    if (rhyme) {
      const c = acrEnding(r, rhyme, used);
      if (c) {
        used.delete(parts[parts.length - 1]);
        parts[parts.length - 1] = c;
        used.add(c);
      }
    }
    return parts.join(" ");
  }

  // Line lengths 1..6, weighted to privilege the middle ranges (2..5).
  const LEN_W = [1, 5, 7, 7, 5, 1];
  const LEN_TOTAL = LEN_W.reduce((s, w) => s + w, 0);
  function nTokLen(r) {
    let x = r() * LEN_TOTAL;
    for (let len = 1; len <= 6; len++) {
      x -= LEN_W[len - 1];
      if (x < 0) return len;
    }
    return 6;
  }

  // Morph continuum from classical to free verse.
  const FAM_ORDER = ["sonnet", "quatrain", "couplets", "tercets", "stanza3",
                     "limerick", "refrain", "blazon", "freeverse"];
  let m = Math.random();
  let dir = Math.random() < 0.5 ? 1 : -1;

  // Independent rhyme continuum: 0 = no rhyme (pure random),
  // 1..3 = line endings share the last 1..3 letters of the acronym.
  // Oscillates on its own phase and tempo, decoupled from the form morph.
  let rh = Math.random();
  let rdir = Math.random() < 0.5 ? 1 : -1;

  // Returns an array of stanza strings (stanzas contain real newlines).
  function stanza() {
    const rr = Math.random;
    const used = new Set();  // one generation = one stanza() call: no repeats
    m += dir * (0.012 + rr() * 0.02);
    if (m > 1) { m = 1; dir = -1; }
    if (m < 0) { m = 0; dir = 1; }
    const fam = FAM_ORDER[Math.max(0, Math.min(FAM_ORDER.length - 1,
      Math.round(m * (FAM_ORDER.length - 1) + (rr() * 3 - 1.5))))];

    rh += rdir * (0.006 + rr() * 0.013);
    if (rh > 1) { rh = 1; rdir = -1; }
    if (rh < 0) { rh = 0; rdir = 1; }
    const k = rh < 0.35 ? 0 : rh < 0.60 ? 1 : rh < 0.80 ? 2 : 3;

    const nTok = () => nTokLen(rr);
    const rhymeMap = {};
    function rhymeEnd(sch, idx) {
      if (k === 0) return null;  // no rhyme at all: pure random endings
      const ch = sch[idx % sch.length];
      if (rhymeMap[ch] === undefined) rhymeMap[ch] = pick(rr, SUFS[k]);
      return { n: k, suffix: rhymeMap[ch] };
    }
    const end = (sch, i) => rhymeEnd(sch, i);

    const st = [];

    if (fam === "sonnet") {
      const sch = "ABABCDCDEFEFGG";
      const q = [];
      for (let i = 0; i < 14; i++) q.push(lineOfLen(rr, nTok(), end(sch, i), used));
      st.push(q.slice(0, 4).join("\n"));
      st.push(q.slice(4, 8).join("\n"));
      st.push(q.slice(8, 11).join("\n"));
      st.push(q.slice(11).join("\n"));
    } else if (fam === "quatrain") {
      const scheme = ["ABAB", "AABB", "ABBA", "ABCB", "AABA"][Math.floor(rr() * 5)];
      const n = 1 + Math.floor(rr() * 2);
      for (let s = 0; s < n; s++) {
        const q = [];
        for (let i = 0; i < 4; i++) q.push(lineOfLen(rr, nTok(), end(scheme, i), used));
        st.push(q.join("\n"));
      }
    } else if (fam === "couplets") {
      const n = 2 + Math.floor(rr() * 2);
      for (let i = 0; i < n; i++) {
        const L = end("AA", 0);
        st.push(lineOfLen(rr, nTok(), L, used) + "\n" + lineOfLen(rr, nTok(), L, used));
      }
    } else if (fam === "tercets") {
      const scheme = ["ABAB", "AABB", "ABBA", "ABCB", "AABA"][Math.floor(rr() * 5)];
      const n = 1 + Math.floor(rr() * 2);
      for (let s = 0; s < n; s++) {
        const q = [];
        for (let i = 0; i < 3; i++) {
          q.push(lineOfLen(rr, nTok(), end(scheme.slice(0, 3), i), used));
        }
        st.push(q.join("\n"));
      }
    } else if (fam === "stanza3") {
      const n = 2 + Math.floor(rr() * 3);
      for (let s = 0; s < n; s++) {
        st.push([
          lineOfLen(rr, nTok(), null, used),
          lineOfLen(rr, nTok(), null, used),
          lineOfLen(rr, nTok(), null, used)
        ].join("\n"));
      }
    } else if (fam === "limerick") {
      const A1 = end("A", 0);
      const B1 = end("B", 0);
      st.push([
        lineOfLen(rr, nTok(), A1, used),
        lineOfLen(rr, nTok(), A1, used),
        lineOfLen(rr, nTok(), B1, used),
        lineOfLen(rr, nTok(), B1, used),
        lineOfLen(rr, nTok(), A1, used)
      ].join("\n"));
    } else if (fam === "refrain") {
      const refrain = lineOfLen(rr, nTok(), null, used);
      const n = 2 + Math.floor(rr() * 2);
      for (let s = 0; s < n; s++) {
        const body = [];
        for (let i = 0; i < 2 + Math.floor(rr() * 2); i++) {
          body.push(lineOfLen(rr, nTok(), null, used));
        }
        body.push(refrain);
        st.push(body.join("\n"));
      }
    } else if (fam === "blazon") {
      const n = 5 + Math.floor(rr() * 5);
      const body = [];
      for (let i = 0; i < n; i++) body.push(lineOfLen(rr, nTok(), null, used));
      st.push(body.join("\n"));
    } else {  // freeverse
      const nL = 4 + Math.floor(rr() * 10);
      const lines = [];
      for (let i = 0; i < nL; i++) {
        lines.push(lineOfLen(rr, nTok(), null, used));
      }
      let cur = [];
      const blocks = [];
      for (const l of lines) {
        cur.push(l);
        if (rr() < 0.55) { blocks.push(cur.join("\n")); cur = []; }
      }
      if (cur.length) blocks.push(cur.join("\n"));
      blocks.forEach(b => {
        const ls = b.split("\n");
        for (let i = 0; i < ls.length; i += 4) {
          st.push(ls.slice(i, i + 4).join("\n"));
        }
      });
    }
    return st;
  }

  return stanza;
}

/* ---------- loader ---------- */

async function loadAll() {
  const text = await (await fetch("acronyms.tsv")).text();
  const A = [];
  const T = {};
  for (const line of text.split("\n")) {
    if (!line) continue;
    const i = line.indexOf("\t");
    const acr = line.slice(0, i);
    A.push(acr);
    T[acr] = line.slice(i + 1);
  }
  return [A, T];
}

/* ---------- stage: fixed viewport, drifting poem, DOM pruning ---------- */

function startStage(A, T) {
  const stanza = makeVerseEngine(A);
  const stage = document.getElementById("stage");
  const flow = document.getElementById("flow");

  // Wrap every acronym in a span carrying its full project title.
  function markup(s) {
    return s.split("\n").map(line =>
      line.split(" ").map(tok =>
        T[tok] === undefined ? escAttr(tok)
          : '<span data-title="' + escAttr(T[tok]) + '">' + escAttr(tok) + "</span>"
      ).join(" ")
    ).join("\n");
  }

  // Bookkeeping kept in JS instead of per-frame DOM reads: Firefox rounds
  // offsetTop/offsetHeight/scrollHeight to integers, which made the prune
  // compensation drift, and reading them every frame forces a sync layout.
  // getBoundingClientRect().height is fractional everywhere and unaffected
  // by the translateY transform.
  let stageH = stage.offsetHeight;
  let marginBottom = 0;
  let contentH = 0;  // tracked layout height of all verses in flow

  function measure(d) {
    d._h = d.getBoundingClientRect().height;
    d._full = d._h + marginBottom;
  }

  function append() {
    for (const s of stanza()) {
      const d = document.createElement("div");
      d.className = "verse";
      d.innerHTML = markup(s);
      flow.appendChild(d);
    }
    for (const d of flow.children) {
      if (d._h === undefined) {
        if (!marginBottom) marginBottom = parseFloat(getComputedStyle(d).marginBottom) || 0;
        measure(d);
        contentH += d._full;
      }
    }
  }

  function remeasure() {
    stageH = stage.offsetHeight;
    marginBottom = flow.children.length
      ? parseFloat(getComputedStyle(flow.children[0]).marginBottom) || 0 : 0;
    contentH = 0;
    for (const d of flow.children) { measure(d); contentH += d._full; }
  }
  window.addEventListener("resize", remeasure);

  append();
  append();
  append();

  let px = stageH;
  let last = performance.now();
  let lastY = null;  // last integer translateY actually written
  const SPEED = 13;  // px per second

  function frame(t) {
    const dt = Math.min(0.1, (t - last) / 1000);
    last = t;
    px += SPEED * dt;

    if (contentH < px + stageH * 2) append();

    // Prune verses that scrolled out and compensate the offset BEFORE the
    // transform is applied, so the compensation lands in the same frame and
    // the scroll never jumps up and back down.
    while (flow.children.length > 1 && flow.children[0]._h < px - 600) {
      px -= flow.children[0]._full;
      contentH -= flow.children[0]._full;
      flow.removeChild(flow.children[0]);
    }

    // Snap the translation to whole CSS pixels. With a fractional translateY,
    // Firefox re-snaps glyph rasterization every frame, so text (and the hover
    // tooltips inside the transformed layer) shimmer by a pixel while scrolling.
    // Only write the style when the integer offset actually changes.
    const y = -Math.round(px);
    if (y !== lastY) {
      flow.style.transform = "translateY(" + y + "px)";
      lastY = y;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ---------- go ---------- */

loadAll().then(([A, T]) => startStage(A, T));
</script>

</body>
</html>
